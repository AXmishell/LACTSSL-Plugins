version: 2

updates:
  # Go 依赖：每周检查一次。minor/patch 合并为一个 PR，major 单独一个，
  # 避免 lego、云厂商 SDK 等大版本升级淹没日常依赖更新。
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      go-major:
        patterns:
          - "*"
        update-types:
          - major

  # GitHub Actions 已固定到 commit SHA；Dependabot 会同步更新 SHA 和版本注释。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
