name: Release plugins

# 发布布局（固定 4 个 Release，不再按插件/版本各建一个）：
#   plugin-index              仅存放 index.json / index.json.sig
#   plugin-assets-<kind>      存放该类别全部插件的 tar.gz 资产
# 资产名自带版本与平台，因此同一 Release 内可覆盖升级：
#   lactssl-<kind>-<id>_<version>_<os>_<arch>.tar.gz
# tag 构建（v1.3.4 / plugins-v1.3.4）时，DNS native、部署与通知包使用 tag 版本 1.3.4；
# all-lego 始终跟随 go.mod 中的 lego 版本。手动触发时使用 plugins.json 中维护的版本。
on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "忽略增量检测，重建全部插件"
        type: boolean
        default: false
      allow_downgrade:
        description: "允许索引版本低于已发布版本（重置插件版本后使用）"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
      - "plugins-v*"

permissions:
  contents: write

# 串行发布，避免两次运行同时改同一个 Release。
concurrency:
  group: release-plugins
  cancel-in-progress: false

env:
  PLATFORMS: "linux/amd64 linux/arm64 darwin/arm64 windows/amd64"
  BUCKET_PREFIX: plugin-assets
  INDEX_TAG: plugin-index
  # prepare 等 job 没有 checkout，需要显式告诉 gh 目标仓库。
  GH_REPO: ${{ github.repository }}

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.matrix.outputs.plugins }}
      kinds: ${{ steps.matrix.outputs.kinds }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release version
        id: release
        run: |
          set -euo pipefail
          version=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#plugins-}"
            version="${version#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.+-][0-9A-Za-z.-]+)?$'; then
              echo "无法从 tag ${GITHUB_REF_NAME} 解析版本号: ${version}" >&2
              exit 1
            fi
            echo "tag ${GITHUB_REF_NAME} -> 包版本 ${version}"
          else
            echo "非 tag 触发，使用 plugins.json 中的内部版本"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Prepare version manifest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_VERSION" ]; then
            # tag 构建：其余合并包统一使用 tag 版本，all-lego / all-lego-v5 跟随各自 lego 版本；只改 CI 工作区，不提交。
            go run scripts/pluginctl/main.go manifest -version "$RELEASE_VERSION"
          else
            go run scripts/pluginctl/main.go manifest
            git diff --exit-code -- plugins.json
          fi

      - name: Detect changed plugins
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_ALL: ${{ inputs.force_all }}
          TAG_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          prev=prev-index.json
          rm -f "$prev"
          if [ -z "$TAG_VERSION" ] && [ "$FORCE_ALL" != "true" ] && gh release view "$INDEX_TAG" >/dev/null 2>&1; then
            gh release download "$INDEX_TAG" --pattern index.json --output "$prev" --clobber || rm -f "$prev"
          fi
          if [ -n "$TAG_VERSION" ]; then
            # tag 版本对所有插件包生效，必须全量重建，避免索引里混入旧 tag 的资产。
            echo "tag 构建：全量重建（all-lego / all-lego-v5 使用 go.mod 中的 lego 版本）"
            jq '[.plugins[]]' plugins.json > changed.json
          elif [ -s "$prev" ]; then
            # 只构建需要重建的插件：新增、版本变化、或索引里仍是旧的直链布局
            # （旧版 workflow 的 /<kind>-<id>-v<version>/ 资产地址）。
            jq --arg bucket "$BUCKET_PREFIX" --slurpfile prev "$prev" '
              ($prev[0].plugins // []
                | map({key: (.kind + "/" + .id), value: .})
                | from_entries) as $known
              | [ .plugins[]
                  | . as $p
                  | ($known[$p.kind + "/" + $p.id]) as $old
                  | ($old.assets // {} | to_entries | first | .value.url // "") as $url
                  | select(
                      $old == null
                      or $old.version != $p.version
                      or (($url | contains("/" + $bucket + "-" + $p.kind + "/")) | not)
                    )
                ]
            ' plugins.json > changed.json
          else
            echo "未找到已发布索引，全量构建"
            jq '[.plugins[]]' plugins.json > changed.json
          fi

          count=$(jq 'length' changed.json)
          kinds=$(jq -r '[.[].kind] | unique | join(" ")' changed.json)
          echo "待构建插件数：$count"
          {
            echo "plugins<<EOF"
            cat changed.json
            echo "EOF"
            echo "kinds=$kinds"
            echo "count=$count"
          } >> "$GITHUB_OUTPUT"

  prepare:
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure bucket releases
        env:
          GH_TOKEN: ${{ github.token }}
          KINDS: ${{ needs.matrix.outputs.kinds }}
        run: |
          set -euo pipefail
          for kind in $KINDS; do
            tag="${BUCKET_PREFIX}-${kind}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "已存在 $tag"
            else
              gh release create "$tag" \
                --title "plugin assets: ${kind}" \
                --notes "LACTSSL ${kind} 插件二进制资产（按版本+平台命名，仅保留索引中的最新版本）" \
                --latest=false
              echo "已创建 $tag"
            fi
          done

  build:
    needs: [matrix, prepare]
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        plugin: ${{ fromJson(needs.matrix.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        env:
          KIND: ${{ matrix.plugin.kind }}
          ID: ${{ matrix.plugin.id }}
          VERSION: ${{ matrix.plugin.version }}
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          for target in $PLATFORMS; do
            goos="${target%/*}"
            goarch="${target#*/}"
            go run scripts/pluginctl/main.go build \
              -kind "$KIND" -id "$ID" -version "$VERSION" \
              -goos "$goos" -goarch "$goarch" -out dist
          done
          ls -lh dist

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.plugin.kind }}
        run: |
          set -euo pipefail
          tag="${BUCKET_PREFIX}-${KIND}"
          # 只上传 tar.gz；meta.json 仅作为 artifact 供 index 汇总，
          # 避免单个 Release 的资产数膨胀（GitHub 上限 1000）。
          gh release upload "$tag" dist/*.tar.gz --clobber

      - name: Upload metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-meta-${{ matrix.plugin.kind }}-${{ matrix.plugin.id }}
          path: dist/*.meta.json
          retention-days: 7

  index:
    needs: [matrix, build]
    # 即使本次没有需要构建的插件（例如仅从 plugins.json 删除插件），
    # 也要重写索引，让 mergeIndex 丢弃已删除条目并触发后续资产清理。
    if: always() && !cancelled() && needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # v8 的 download-artifact 已移除 if-no-files-found；
        # 没有待构建插件时允许继续，由后续 mergeIndex 重写索引。
        continue-on-error: true
        with:
          pattern: plugin-meta-*
          path: dist
          merge-multiple: true

      - name: Fetch previous index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$INDEX_TAG" >/dev/null 2>&1; then
            gh release download "$INDEX_TAG" --pattern index.json --output prev-index.json --clobber || true
          fi

      - name: Generate index
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
        run: |
          set -euo pipefail
          args=()
          [ -s prev-index.json ] && args+=(-prev prev-index.json)
          [ "$ALLOW_DOWNGRADE" = "true" ] && args+=(-allow-downgrade)
          go run scripts/pluginctl/main.go index \
            -assets dist \
            -base-url "https://github.com/${{ github.repository }}/releases/download" \
            -bucket "$BUCKET_PREFIX" \
            "${args[@]}" \
            -out index.json
          test "$(jq '.plugins | length' index.json)" -gt 0

      - name: Sign index
        env:
          SIGNING_KEY: ${{ secrets.PLUGIN_INDEX_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" > /tmp/index.key
            go run scripts/pluginctl/main.go sign -key /tmp/index.key -in index.json -out index.json.sig
            rm -f /tmp/index.key
          else
            echo "未配置 PLUGIN_INDEX_SIGNING_KEY，跳过索引签名"
          fi

      - name: Publish index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="index.json"
          [ -f index.json.sig ] && assets="$assets index.json.sig"
          if gh release view "$INDEX_TAG" >/dev/null 2>&1; then
            gh release upload "$INDEX_TAG" $assets --clobber
            gh release edit "$INDEX_TAG" --latest=false
          else
            gh release create "$INDEX_TAG" $assets \
              --title "plugin index" \
              --notes "LACTSSL plugin repository index" \
              --latest=false
          fi

      - name: Prune superseded assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 索引只保留每个插件的最新版本，旧版本资产随之删除，
          # 使 bucket Release 的资产数量保持稳定（约 4 × 插件数）。
          jq -r '.plugins[].assets[].url | split("/") | last' index.json | sort -u > expected.txt
          for kind in $(jq -r '[.plugins[].kind] | unique | .[]' index.json); do
            tag="${BUCKET_PREFIX}-${kind}"
            gh release view "$tag" >/dev/null 2>&1 || continue
            while read -r name; do
              [ -z "$name" ] && continue
              if ! grep -qxF "$name" expected.txt; then
                echo "删除过期资产 $tag/$name"
                gh release delete-asset "$tag" "$name" -y
              fi
            done < <(gh release view "$tag" --json assets -q '.assets[].name')
            total=$(gh release view "$tag" --json assets -q '.assets | length')
            if [ "$total" -gt 950 ]; then
              echo "::warning title=资产数接近上限::$tag 已有 $total 个资产，接近 GitHub 1000 上限，请拆分 bucket。"
            fi
          done
