name: Release plugins

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "plugins-v*"

permissions:
  contents: write

env:
  PLATFORMS: "linux/amd64 linux/arm64 darwin/arm64 windows/amd64"

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.matrix.outputs.plugins }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build matrix
        id: matrix
        run: |
          {
            echo 'plugins<<EOF'
            go run scripts/pluginctl/main.go matrix
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        plugin: ${{ fromJson(needs.matrix.outputs.plugins) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        env:
          KIND: ${{ matrix.plugin.kind }}
          ID: ${{ matrix.plugin.id }}
          VERSION: ${{ matrix.plugin.version }}
        run: |
          set -e
          rm -rf dist
          mkdir -p dist
          for target in $PLATFORMS; do
            goos="${target%/*}"
            goarch="${target#*/}"
            go run scripts/pluginctl/main.go build \
              -kind "$KIND" -id "$ID" -version "$VERSION" \
              -goos "$goos" -goarch "$goarch" -out dist
          done
          ls -lh dist

      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ matrix.plugin.kind }}
          ID: ${{ matrix.plugin.id }}
          VERSION: ${{ matrix.plugin.version }}
        run: |
          set -e
          tag="${KIND}-${ID}-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.meta.json --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/*.meta.json \
              --title "${KIND}/${ID} v${VERSION}" \
              --notes "LACTSSL ${KIND} plugin ${ID} ${VERSION}"
          fi

      - name: Upload metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-meta-${{ matrix.plugin.kind }}-${{ matrix.plugin.id }}
          path: dist/*.meta.json
          retention-days: 7

  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: plugin-meta-*
          path: dist
          merge-multiple: true

      - name: Generate index
        run: |
          go run scripts/pluginctl/main.go index \
            -assets dist \
            -base-url "https://github.com/${{ github.repository }}/releases/download" \
            -out index.json

      - name: Sign index
        env:
          SIGNING_KEY: ${{ secrets.PLUGIN_INDEX_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" > /tmp/index.key
            go run scripts/pluginctl/main.go sign -key /tmp/index.key -in index.json -out index.json.sig
            rm -f /tmp/index.key
          else
            echo "未配置 PLUGIN_INDEX_SIGNING_KEY，跳过索引签名"
          fi

      - name: Publish index release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          assets="index.json"
          [ -f index.json.sig ] && assets="$assets index.json.sig"
          if gh release view plugin-index >/dev/null 2>&1; then
            gh release upload plugin-index $assets --clobber
          else
            gh release create plugin-index $assets \
              --title "plugin index" \
              --notes "LACTSSL plugin repository index"
          fi
