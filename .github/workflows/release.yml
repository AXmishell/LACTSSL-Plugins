name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi
          mkdir -p out
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "out/lactssl-dns-helper-extra${ext}" ./cmd/dns-helper
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "out/lactssl-deploy-helper${ext}" ./cmd/deploy-helper
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "out/lactssl-notify-helper${ext}" ./cmd/notify-helper
          ls -lh out

      - name: Package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${VERSION#v}"
          name="lactssl-plugins_${version}_${GOOS}_${GOARCH}"
          mkdir -p stage dist
          cp README.md LICENSE stage/
          cp out/* stage/
          if [ "$GOOS" = "windows" ]; then
            (cd stage && zip -q -r "../dist/${name}.zip" .)
          else
            tar -czf "dist/${name}.tar.gz" -C stage .
          fi
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugins-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "LACTSSL plugins $GITHUB_REF_NAME"
