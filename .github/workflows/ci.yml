name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build helpers
        run: |
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/dns-helper
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/deploy-helper
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/notify-helper

      - name: Verify manifest parity
        run: go test ./cmd/... -run 'TestManifest'
