name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: Verify bundle manifest
        run: |
          go run scripts/pluginctl/main.go manifest
          go run scripts/pluginctl/main.go gen
          test -z "$(git status --porcelain -- plugins.json cmd/dns-helper dns/groups)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check native bundle
        run: ./scripts/check_native.sh

      - name: Build bundle helpers
        run: |
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/dns-helper
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/deploy-helper
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/notify-helper

      - name: Build merged plugins
        run: |
          go build -trimpath -tags "bundle_dns_core,nethttpomithttp2" -o /tmp/dns-core ./cmd/dns-helper
          go build -trimpath -tags "bundle_dns_heavy,nethttpomithttp2" -o /tmp/dns-heavy ./cmd/dns-helper
          go build -trimpath -tags "bundle_dns_heavy_native,nethttpomithttp2" -o /tmp/dns-heavy-native ./cmd/dns-helper
          go build -trimpath -tags "bundle_dns_core_native,nethttpomithttp2" -o /tmp/dns-core-native ./cmd/dns-helper
          go build -trimpath -tags nethttpomithttp2 -o /tmp/dns-all ./cmd/dns-helper
          go build -trimpath -tags nethttpomithttp2 -o /tmp/deploy-all ./cmd/deploy-helper
          go build -trimpath -tags nethttpomithttp2 -o /tmp/notify-all ./cmd/notify-helper
          test "$(/tmp/dns-core manifest | jq '.providers | length')" = "184"
          test "$(/tmp/dns-heavy manifest | jq '.providers | length')" = "10"
          test "$(/tmp/dns-heavy-native manifest | jq '.providers | length')" = "10"
          test "$(/tmp/dns-core-native manifest | jq '.providers | length')" = "184"
          test "$(/tmp/dns-all manifest | jq '.providers | length')" = "194"
          test "$(LACTSSL_DEPLOY_PLUGIN_FEATURES=merged-deployers-v1 /tmp/deploy-all manifest | jq '.deployers | length')" = "37"
          test "$(/tmp/notify-all manifest | jq '.channels | length')" = "23"
          test "$(/tmp/dns-core manifest | jq -r '.providers[] | select(.id=="cloudflare") | .id')" = "cloudflare"

      - name: Package smoke
        run: |
          go run scripts/pluginctl/main.go build -kind dns -id core -goos linux -goarch amd64 -out /tmp/dist
          tar -tzf /tmp/dist/lactssl-dns-core_1.0.0_linux_amd64.tar.gz | grep -qx plugin.json
          tar -tzf /tmp/dist/lactssl-dns-core_1.0.0_linux_amd64.tar.gz | grep -qx icons/cloudflare.svg
          go run scripts/pluginctl/main.go index -assets /tmp/dist -base-url https://example.invalid/releases/download -out /tmp/index.json
          jq -e '.plugins[0].assets["linux/amd64"].sha256' /tmp/index.json >/dev/null
          jq -e '.plugins[0].bundle == true' /tmp/index.json >/dev/null
          jq -e '.plugins[0].uncompressed_size > 0' /tmp/index.json >/dev/null
          jq -e '[.icons[] | select(.id == "cloudflare")] | length == 1' /tmp/index.json >/dev/null
          jq -e '.icons[] | select(.id == "cloudflare") | .data | startswith("data:image/svg+xml;base64,")' /tmp/index.json >/dev/null
