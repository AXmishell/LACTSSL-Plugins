name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: Verify generated selectors
        run: |
          go run scripts/pluginctl/main.go gen
          git diff --exit-code -- cmd/dns-plugin cmd/deploy-plugin cmd/notify-plugin plugins.json

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build bundle helpers
        run: |
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/dns-helper
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/deploy-helper
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/notify-helper

      - name: Build single plugins
        run: |
          go build -trimpath -tags plugin_dns_cloudflare -o /tmp/dns-plugin ./cmd/dns-plugin
          go build -trimpath -tags plugin_deploy_baota -o /tmp/deploy-plugin ./cmd/deploy-plugin
          go build -trimpath -tags plugin_notify_telegram -o /tmp/notify-plugin ./cmd/notify-plugin
          test "$(/tmp/dns-plugin manifest | jq '.providers | length')" = "1"
          test "$(/tmp/deploy-plugin manifest | jq '.deployers | length')" = "1"
          test "$(/tmp/notify-plugin manifest | jq '.channels | length')" = "1"
          test "$(/tmp/dns-plugin manifest | jq -r '.providers[0].id')" = "cloudflare"
          test "$(/tmp/deploy-plugin manifest | jq -r '.deployers[0].id')" = "baota"
          test "$(/tmp/notify-plugin manifest | jq -r '.channels[0].id')" = "telegram"

      - name: Package smoke
        run: |
          go run scripts/pluginctl/main.go build -kind dns -id cloudflare -goos linux -goarch amd64 -out /tmp/dist
          tar -tzf /tmp/dist/lactssl-dns-cloudflare_1.0.0_linux_amd64.tar.gz | grep -qx plugin.json
          go run scripts/pluginctl/main.go index -assets /tmp/dist -base-url https://example.invalid/releases/download -out /tmp/index.json
          jq -e '.plugins[0].assets["linux/amd64"].sha256' /tmp/index.json >/dev/null
